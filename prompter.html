<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Dublaj Prompter</title>
<style>
  :root { --font: 44px; --margin: 22%; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
               font-family: "Segoe UI", Arial, sans-serif; }
  #ayar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; display: flex; gap: 16px;
          align-items: center; padding: 6px 12px; background: #111; font-size: 13px; opacity: .85; }
  #ayar input[type=range] { width: 110px; }
  #kumanda button { background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;
                    padding: 4px 10px; font-size: 13px; cursor: pointer; }
  #kumanda button:hover { background: #333; }
  .satir, .not { cursor: pointer; }
  #sahne { position: absolute; inset: 40px 0 0 0; overflow: hidden; }
  #akis { position: absolute; left: var(--margin); right: var(--margin); top: 0;
          transition: transform .25s linear; font-size: var(--font); line-height: 1.45; }
  body.ayna #akis { transform-origin: center; }
  .satir { padding: 2px 0; color: #777; }
  .satir.aktif { color: #fff; }
  .satir.gecti { color: #444; }
  :root { --lit: #fff; --soluk: hsl(220 10% 52%); }
  /* Karaoke: aktif satırda her kelime soluktan beyaza yumuşak bir kenarla dolar (--a, --b JS'ten gelir) */
  body.karaoke .satir.aktif .k {
    background: linear-gradient(90deg, var(--lit) var(--a, -24%), var(--soluk) var(--b, 0%));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .not { color: #f5c542; font-size: .55em; font-weight: 700; padding: 10px 0; }
  .bosluk { height: 1.2em; }
  .ipucu { color: #5aa9e6; font-size: .45em; font-style: italic; padding: 4px 0 10px; }
  body.ipucuKapali .ipucu { display: none; }
  #cizgi { position: absolute; left: 0; right: 0; top: 35%; height: 0; border-top: 1px solid #333; }
  #yukle { position: absolute; inset: 40px 0 0 0; display: none; align-items: center;
           justify-content: center; font-size: 18px; }
</style>
</head>
<body>
<div id="ayar">
  <label>Font <input id="font" type="range" min="24" max="80" value="44"></label>
  <label>Margin <input id="margin" type="range" min="5" max="35" value="22"></label>
  <label>Öne al (sn) <input id="onde" type="number" step="0.1" value="0.5" style="width:56px"></label>
  <label><input id="ayna" type="checkbox"> Ayna</label>
  <label><input id="ipucu" type="checkbox" checked> İng. ipucu</label>
  <label><input id="karaoke" type="checkbox" checked> Karaoke</label>
  <label>Soluk <input id="soluk" type="range" min="25" max="70" value="52"></label>
  <span id="kumanda">
    <button data-fark="-10">-10 sn</button>
    <button data-fark="-5">-5 sn</button>
    <button id="oynat">Oynat / Durdur</button>
    <button data-fark="5">+5 sn</button>
    <button data-fark="10">+10 sn</button>
  </span>
  <span id="ritimBilgi" style="color:#8a93a3"></span>
  <span id="durum">video bekleniyor</span>
</div>
<div id="sahne"><div id="cizgi"></div><div id="akis"></div></div>
<div id="yukle">Metin dosyası bulunamadı: <input id="dosya" type="file" accept=".txt"></div>
<script>
  const q = new URLSearchParams(location.search);
  const akis = document.getElementById("akis");
  const kanal = new BroadcastChannel("dublaj");
  let satirlar = []; // {t, el}
  let aktif = -1;
  let son = { t: 0, oynuyor: false, ne: performance.now() };

  // [m:ss ...] başlığını ayrıştırır: ilk m:ss başlangıç zamanı, kalan kısım sahne notu
  function ayristir(metin) {
    const bas = /^\[(\d+):(\d{2})(?:[^\]]*?\|\s*|\s*-\s*)?([^\]]*)\]\s*(.*)$/;
    const bloklar = [];
    let mevcut = null;
    for (const ham of metin.split(/\r?\n/)) {
      const l = ham.trim();
      const m = l.match(bas);
      if (m) {
        mevcut = { t: +m[1] * 60 + +m[2], not: m[3].replace(/^\d+:\d{2}\s*\|?\s*/, "").trim(),
                   satirlar: [] };
        if (m[4]) mevcut.satirlar.push(m[4]);
        bloklar.push(mevcut);
      } else if (mevcut && l.startsWith("~")) {
        mevcut.satirlar.push({ ipucu: l.slice(1).trim() });
      } else if (mevcut && l === ".") {
        mevcut.satirlar.push(null);
      } else if (mevcut && l) {
        mevcut.satirlar.push(l);
      }
    }
    return bloklar;
  }

  // Satırı kelimelere böler; her kelime [bas, son] aralığıyla satırın ağırlık ekseninde yer alır.
  // Ağırlık Türkçe hece sayısıdır (sesli harf sayısı). duraklar açıksa noktalama sonrası bekleme payı
  // eklenir; bu, İngilizce konuşma ritmi (ritim.json) yokken kullanılan yedek davranıştır.
  function kelimelereBol(s, duraklar) {
    const hece = (w) => Math.max(1, (w.match(/[aeıioöuüAEIİOÖUÜâîû]/g) || []).length);
    let gec = 0;
    const liste = s.split(/(\s+)/).filter(Boolean).map((parca) => {
      if (/^\s+$/.test(parca)) return { metin: parca, bosluk: true };
      const agirlik = hece(parca) + 0.4;
      const k = { metin: parca, bas: gec, son: gec + agirlik };
      gec += agirlik;
      if (duraklar) gec += /[.!?…]["')»]*$/.test(parca) ? 1 : /[,;:]["')»]*$/.test(parca) ? 0.6 : 0;
      return k;
    });
    liste.agirlik = gec || 1;
    return liste;
  }

  let ritim = []; // veri/<id>/ritim.json: İngilizce kelime zamanları [[bas, son], ...]

  // [t0, t1] penceresindeki konuşmayı (duraklar hariç) saniye parçaları olarak toplar
  function konusmaEgrisi(t0, t1) {
    const parcalar = [];
    for (const [b, s] of ritim) {
      if (s <= t0) continue;
      if (b >= t1) break;
      const bb = Math.max(b, t0), ss = Math.min(s, t1);
      if (ss > bb) parcalar.push([bb, ss]);
    }
    const toplam = parcalar.reduce((a, p) => a + p[1] - p[0], 0);
    return toplam ? { parcalar, toplam } : null;
  }

  // Konuşmanın f oranı (0-1) tamamlandığı an. basla: duraktan sonra konuşmanın yeniden başladığı an
  function egridenZaman(e, f, basla) {
    const hedef = f * e.toplam;
    let gec = 0;
    for (const [b, s] of e.parcalar) {
      const d = s - b;
      if (basla ? hedef < gec + d - 1e-9 : hedef <= gec + d + 1e-9) return b + Math.max(0, hedef - gec);
      gec += d;
    }
    return e.parcalar[e.parcalar.length - 1][1];
  }

  // t anına kadar konuşulan sürenin toplama oranı (0-1); duraklarda sabit kalır
  function konusmaIlerleme(e, t) {
    let gec = 0;
    for (const [b, s] of e.parcalar) {
      if (t <= b) break;
      gec += Math.min(t, s) - b;
      if (t < s) break;
    }
    return gec / e.toplam;
  }

  let ritimMetin = []; // ritim.json "metinli": [{k: kelime, b: başlangıç, e: bitiş}, ...]

  // --- v3: Türkçe kelimeleri İngilizce kelimelere çapalama ---
  const SAYI_TR = { sıfır: "0", iki: "2", üç: "3", dört: "4", beş: "5", altı: "6", yedi: "7", sekiz: "8", dokuz: "9", on: "10" };
  const SAYI_EN = { zero: "0", two: "2", three: "3", four: "4", five: "5", six: "6", seven: "7", eight: "8", nine: "9", ten: "10" };
  const SADE = { ç: "c", ğ: "g", ı: "i", ö: "o", ş: "s", ü: "u", â: "a", î: "i", û: "u" };

  // Karşılaştırma için kelimeyi sadeleştirir: küçük harf, ek ve noktalama yok, sayı sözcükleri rakam
  function sadelestir(w, tr) {
    const alt = (tr ? w.toLocaleLowerCase("tr") : w.toLowerCase()).split(/['’]/)[0].replace(/[^\p{L}\p{N}]/gu, "");
    const tablo = tr ? SAYI_TR : SAYI_EN;
    if (Object.hasOwn(tablo, alt)) return tablo[alt];
    return alt.replace(/[çğıöşüâîû]/g, (c) => SADE[c]);
  }

  function uzaklik(a, b) {
    let onceki = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      const simdiki = [i];
      for (let j = 1; j <= b.length; j++)
        simdiki[j] = Math.min(onceki[j] + 1, simdiki[j - 1] + 1, onceki[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      onceki = simdiki;
    }
    return onceki[b.length];
  }

  // İki sadeleştirilmiş kelimenin çapa olma puanı (0 = çapa değil): aynı sayı, aynı kelime (4+ harf) ya da benzer (5+ harf)
  function benzerlik(a, b) {
    if (!a || !b) return 0;
    if (/^\d+$/.test(a) || /^\d+$/.test(b)) return a === b ? 1 : 0;
    if (a === b) return a.length >= 4 ? 1 : 0;
    if (a.length < 5 || b.length < 5) return 0;
    const r = 1 - uzaklik(a, b) / Math.max(a.length, b.length);
    return r >= 0.72 ? r : 0;
  }

  // Türkçe ve İngilizce kelime dizileri arasında sıralı (kesişmeyen) en yüksek puanlı çapa zinciri
  function hizala(tr, en) {
    const aday = [];
    tr.forEach((a, i) => en.forEach((b, j) => {
      if (Math.abs(i / tr.length - j / en.length) > 0.5) return; // blok içinde çok uzak eşleşme çapa olmaz
      const s = benzerlik(a, b);
      if (s > 0) aday.push({ i, j, s });
    }));
    aday.sort((x, y) => x.i - y.i || x.j - y.j);
    const dp = [];
    let enIyi = -1;
    aday.forEach((c, k) => {
      dp[k] = { skor: c.s, onceki: -1 };
      for (let l = 0; l < k; l++) {
        if (aday[l].i < c.i && aday[l].j < c.j && dp[l].skor + c.s > dp[k].skor) dp[k] = { skor: dp[l].skor + c.s, onceki: l };
      }
      if (enIyi < 0 || dp[k].skor > dp[enIyi].skor) enIyi = k;
    });
    const zincir = [];
    for (let k = enIyi; k >= 0; k = dp[k].onceki) zincir.unshift(aday[k]);
    return zincir;
  }

  const sinirla = (x) => Math.min(1, Math.max(0, x));

  // [ta, tb] aralığı için konuşma ilerlemesi (duraklarda sabit) ve oran-an dönüşümü
  function aralik(ta, tb) {
    const e = ritim.length ? konusmaEgrisi(ta, tb) : null;
    return {
      ilerle: e ? (t) => konusmaIlerleme(e, t) : (t) => sinirla((t - ta) / ((tb - ta) || 1)),
      zaman: (oran, basla) => e ? egridenZaman(e, oran, basla) : ta + (tb - ta) * oran,
    };
  }

  // Bir bloğun satır ve kelime zamanlamasını hesaplar (DOM'suz). Çapalı kelime, İngilizce karşılığının
  // söylendiği aralıkta dolar; çapalar arası kelimeler o aralıktaki konuşma ilerlemesine göre dağılır.
  // Çapa ya da ritim yoksa tüm blok tek aralık olur (v2 davranışı).
  function blokPlanla(b, bitis) {
    const metinli = b.satirlar.filter((s) => typeof s === "string");
    const egri = ritim.length ? konusmaEgrisi(b.t, bitis) : null;
    const parcaListe = metinli.map((s) => kelimelereBol(s, !egri));
    const toplam = parcaListe.reduce((a, p) => a + p.agirlik, 0) || 1;
    const kel = [];
    let gec = 0;
    for (const parcalar of parcaListe) {
      for (const k of parcalar) if (!k.bosluk) { k.A = (gec + k.bas) / toplam; k.B = (gec + k.son) / toplam; kel.push(k); }
      gec += parcalar.agirlik;
    }
    const en = egri && ritimMetin.length ? ritimMetin.filter((w) => w.b >= b.t - 0.1 && w.b < bitis - 0.02) : [];
    const capa = en.length && kel.length
      ? hizala(kel.map((k) => sadelestir(k.metin, true)), en.map((w) => sadelestir(w.k, false))) : [];

    let onceki = { idx: -1, t: b.t, x: 0 };
    const kapat = (sonIdx, tSon, xSon) => { // önceki çapa ile sonraki çapa arasındaki çapasız kelimeler
      const n = sonIdx - onceki.idx - 1;
      if (n <= 0) return;
      const ar = aralik(onceki.t, Math.max(tSon, onceki.t + 0.12 * n));
      const genislik = (xSon - onceki.x) || 1;
      for (let i = onceki.idx + 1; i < sonIdx; i++) {
        const k = kel[i];
        const A = (k.A - onceki.x) / genislik, B = (k.B - onceki.x) / genislik;
        k.doldur = (t) => sinirla((ar.ilerle(t) - A) / ((B - A) || 1e-6));
        k.basT = ar.zaman(A, true);
      }
    };
    for (const c of capa) {
      const k = kel[c.i], w = en[c.j];
      kapat(c.i, w.b, k.A);
      k.doldur = (t) => sinirla((t - w.b) / ((w.e - w.b) || 1e-6));
      k.basT = w.b;
      onceki = { idx: c.i, t: w.e, x: k.B };
    }
    kapat(kel.length, bitis, 1);

    let onceT = b.t;
    const satirlar = parcaListe.map((parcalar, j) => {
      const ilk = parcalar.find((k) => !k.bosluk);
      const t = j === 0 ? b.t : Math.min(bitis - 0.01, Math.max(onceT, ilk ? ilk.basT : onceT));
      onceT = t;
      return { t, parcalar };
    });
    return { satirlar, capaSayisi: capa.length, kelimeSayisi: kel.length, ritimli: !!egri };
  }

  function kur(metin) {
    akis.innerHTML = "";
    satirlar = [];
    const bilgi = { capa: 0, kelime: 0, ritimli: 0 };
    const bloklar = ayristir(metin);
    bloklar.forEach((b, i) => {
      const bitis = i + 1 < bloklar.length ? bloklar[i + 1].t : b.t + 6;
      if (b.not) {
        const n = document.createElement("div");
        n.className = "not";
        n.textContent = "[" + b.not + "]";
        akis.appendChild(n);
        satirlar.push({ t: b.t, el: n });
      }
      const plan = blokPlanla(b, bitis);
      bilgi.capa += plan.capaSayisi;
      bilgi.kelime += plan.kelimeSayisi;
      if (plan.ritimli) bilgi.ritimli++;
      let sira = 0;
      for (const s of b.satirlar) {
        if (s === null) {
          const d = document.createElement("div");
          d.className = "bosluk";
          akis.appendChild(d);
          continue;
        }
        if (typeof s === "object") {
          const ip = document.createElement("div");
          ip.className = "ipucu";
          ip.textContent = "EN  " + s.ipucu;
          akis.appendChild(ip);
          continue;
        }
        const pl = plan.satirlar[sira++];
        const el = document.createElement("div");
        el.className = "satir";
        const kelimeler = [];
        for (const k of pl.parcalar) {
          if (k.bosluk) { el.appendChild(document.createTextNode(k.metin)); continue; }
          const sp = document.createElement("span");
          sp.className = "k";
          sp.textContent = k.metin;
          el.appendChild(sp);
          kelimeler.push({ sp, doldur: k.doldur });
        }
        akis.appendChild(el);
        satirlar.push({ t: pl.t, el, kelimeler });
      }
    });
    satirlar.forEach((s) => { s.el.onclick = () => sar(s.t); });
    document.getElementById("ritimBilgi").textContent = ritim.length
      ? "ritim: " + (ritimMetin.length ? "v3" : "v2") + ", çapa " + bilgi.capa + "/" + bilgi.kelime
      : "ritim yok (yedek)";
    aktif = -1;
  }

  function guncelle(t) {
    let i = -1;
    for (let k = 0; k < satirlar.length; k++) if (satirlar[k].t <= t) i = k; else break;
    if (i !== aktif) {
      aktif = i;
      satirlar.forEach((s, k) => {
        s.el.classList.toggle("aktif", k === i);
        s.el.classList.toggle("gecti", k < i);
      });
      if (i >= 0) {
        const hedef = document.getElementById("sahne").clientHeight * 0.35;
        akis.style.transform = "translateY(" + (hedef - satirlar[i].el.offsetTop) + "px)";
      }
    }
    if (aktif >= 0 && document.body.classList.contains("karaoke")) kelimeDoldur(satirlar[aktif], t);
  }

  // Aktif satırda her kelimeyi kendi doldur(t) oranına (0-1) göre soluktan beyaza doldurur; kenar 24% yumuşaktır
  function kelimeDoldur(s, t) {
    if (!s.kelimeler) return;
    for (const k of s.kelimeler) {
      const f = k.doldur(t);
      const a = -24 + f * 124;
      k.sp.style.setProperty("--a", a + "%");
      k.sp.style.setProperty("--b", (a + 24) + "%");
    }
  }

  // Yalnızca kendi videosunun zamanını dinle: eski açık video sekmeleri aynı kanala yayın yapabilir
  const benimId = q.get("v") || ((q.get("f") || "").match(/veri\/([^/]+)\//) || [])[1];
  let hedef = null; // sar komutu gönderildi: video atlayana kadar gelen eski zamanları yok say
  kanal.onmessage = (e) => {
    const { t, oynuyor } = e.data;
    if (t === undefined) return;
    if (benimId && e.data.v !== benimId) return;
    const an = performance.now();
    if (hedef) {
      if (an > hedef.bitis) hedef = null;
      else if (Math.abs(t - hedef.t) > 1.5) return;
      else hedef = null;
    }
    // Oynatıcı süreyi ~250 ms'lik adımlarla bildirir: küçük farkları yumuşat (saat geri sıçramasın),
    // büyük farkı ve oynat/durdur değişimini gerçek atlama say
    const fark = t - simdi();
    if (oynuyor && son.oynuyor && Math.abs(fark) < 0.6) son = { t: simdi() + fark * 0.15, oynuyor, ne: an };
    else son = { t, oynuyor, ne: an };
    document.getElementById("durum").textContent =
      (oynuyor ? "oynuyor " : "durdu ") + t.toFixed(1) + " sn";
  };

  function dongu() {
    const onde = parseFloat(document.getElementById("onde").value) || 0;
    const gecen = son.oynuyor ? (performance.now() - son.ne) / 1000 : 0;
    guncelle(son.t + gecen + onde);
    requestAnimationFrame(dongu);
  }

  // Kumanda: komutlar video sekmesine gider
  const simdi = () => son.t + (son.oynuyor ? (performance.now() - son.ne) / 1000 : 0);
  function sar(t) {
    t = Math.max(0, t);
    son = { t, oynuyor: son.oynuyor, ne: performance.now() };
    hedef = { t, bitis: performance.now() + 1500 };
    kanal.postMessage({ komut: "sar", t, v: benimId });
  }
  function oynatDurdur() {
    kanal.postMessage({ komut: son.oynuyor ? "durdur" : "oynat", v: benimId });
  }
  document.querySelectorAll("#kumanda [data-fark]").forEach((b) => {
    b.onclick = () => { sar(simdi() + parseFloat(b.dataset.fark)); b.blur(); };
  });
  document.getElementById("oynat").onclick = (e) => { oynatDurdur(); e.target.blur(); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); oynatDurdur(); }
    else if (e.code === "ArrowLeft") { e.preventDefault(); sar(simdi() - (e.shiftKey ? 10 : 5)); }
    else if (e.code === "ArrowRight") { e.preventDefault(); sar(simdi() + (e.shiftKey ? 10 : 5)); }
  });

  document.getElementById("font").oninput = (e) =>
    document.documentElement.style.setProperty("--font", e.target.value + "px");
  document.getElementById("margin").oninput = (e) =>
    document.documentElement.style.setProperty("--margin", e.target.value + "%");
  document.getElementById("ayna").onchange = (e) => {
    document.getElementById("sahne").style.transform = e.target.checked ? "scaleX(-1)" : "";
  };
  document.body.classList.add("karaoke");
  document.getElementById("karaoke").onchange = (e) => {
    document.body.classList.toggle("karaoke", e.target.checked);
    aktif = -1;
  };
  document.getElementById("soluk").oninput = (e) =>
    document.documentElement.style.setProperty("--soluk", "hsl(220 10% " + e.target.value + "%)");
  document.getElementById("ipucu").onchange = (e) => {
    document.body.classList.toggle("ipucuKapali", !e.target.checked);
    aktif = -1;
  };
  document.getElementById("dosya").onchange = (e) =>
    e.target.files[0].text().then((m) => { document.getElementById("yukle").style.display = "none"; kur(m); });

  // İngilizce konuşma ritmi isteğe bağlıdır: dosya yoksa karaoke yedek ağırlıklarla çalışır
  const ritimYukle = benimId
    ? fetch("veri/" + benimId + "/ritim.json").then((r) => (r.ok ? r.json() : null))
        .then((j) => {
          if (!j || !j.kelimeler) return;
          ritim = j.kelimeler;
          ritimMetin = (j.metinli || []).map(([k, b, e]) => ({ k, b, e }));
        }).catch(() => {})
    : Promise.resolve();
  const f = q.get("f");
  if (f) {
    ritimYukle.then(() => fetch(f)).then((r) => { if (!r.ok) throw 0; return r.text(); }).then(kur)
      .catch(() => { document.getElementById("yukle").style.display = "flex"; });
  } else {
